[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automatiza-testes"
version = "0.1.0"
description = "Testes de aplicações Windows e SQL Server"
requires-python = ">=3.10"
dependencies = [
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "pyodbc>=5.2,<6",
  "python-dotenv>=1.1,<2",
  "pytest>=8.3,<10",
  "pytest-html>=4.1,<5",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "robotframework>=7,<8",
]

[project.scripts]
automatiza = "automatiza.nova_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "banco: acessa um SQL Server real",
  "desktop: interage com uma aplicação Windows real",
]
